name: Deploy Weekly 1:1 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate generated Builder runtime
        run: |
          node --check pasqal-quarkfoil-v1_7.js
          node --check builder-vector-pdf-v1_7_5.js
          node --check real-state-v1_1.js
          grep -q 'pasqal-quarkfoil-v1_7.js' index.html
          grep -q 'builder-vector-pdf-v1_7_5.js' index.html
          ! grep -q 'builder-vector-pdf-v1_7_4.js' index.html
          ! grep -q 'builder-vector-pdf-v1_7_3.js' index.html
          ! grep -q 'builder-vector-pdf-v1_7_2.js' index.html
          grep -q "view:'print'" builder-vector-pdf-v1_7_5.js
          grep -q '@page{size:13.333333in 7.5in;margin:0}' builder-vector-pdf-v1_7_5.js
          grep -q 'qfPreviewPrintGuard' builder-vector-pdf-v1_7_5.js
          grep -q 'Preview only' builder-vector-pdf-v1_7_5.js
          grep -q 'normalizeDeckSlideIds' builder-vector-pdf-v1_7_5.js
          grep -q 'normalizeEditorSlideIds' builder-vector-pdf-v1_7_5.js
          grep -q '8bed44d3619bb1a4e6ce3b8dd2b17925830ca7b3' builder-vector-pdf-v1_7_5.js
          ! grep -q 'builder-raster-pdf-hotfix.js' index.html
          ! grep -q 'builder-raster-pdf-emergency-fallback.js' index.html
          ! grep -q 'builder-pdf-parity-v1_7_1.js' index.html
          ! grep -E 'pasqal-quarto|quick-builder|qmd-generation|deliverable-builder|pasqal-preview|pasqal-parity|pasqal-quarkfoil-v1_4' index.html
          ! grep -q 'state = clone(seed)' real-state-v1_1.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
