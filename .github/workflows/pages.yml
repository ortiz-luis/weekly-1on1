name: Deploy Weekly 1:1 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate generated Builder runtime
        run: |
          node --check pasqal-quarkfoil-v1_7.js
          node --check builder-raster-pdf-hotfix.js
          node --check real-state-v1_1.js
          grep -q 'pasqal-quarkfoil-v1_7.js' index.html
          grep -q 'builder-raster-pdf-hotfix.js' index.html
          ! grep -q 'builder-pdf-parity-v1_7_1.js' index.html
          ! grep -E 'pasqal-quarto|quick-builder|qmd-generation|deliverable-builder|pasqal-preview|pasqal-parity|pasqal-quarkfoil-v1_4' index.html
          ! grep -q 'state = clone(seed)' real-state-v1_1.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
