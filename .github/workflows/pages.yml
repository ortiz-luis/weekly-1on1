name: Deploy Weekly 1:1 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Quarkfoil V1.7 runtime
        run: |
          node --check pasqal-quarkfoil-v1_7.js
          grep -q 'pasqal-quarkfoil-v1_7.js' index.html
          ! grep -E 'pasqal-quarto|quick-builder|qmd-generation|deliverable-builder|pasqal-preview|pasqal-parity|pasqal-quarkfoil-v1_4' index.html
      - name: Install browser smoke dependencies
        run: python -m pip install --disable-pip-version-check selenium pypdf
      - name: Run Builder V1.7 end-to-end smoke
        run: python tests/builder_v1_7_smoke.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
